<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#111111" />
  <title>Handyman: live repair coach</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main>
    <header>
      <h1>Handyman</h1>
      <p id="status" role="status" aria-live="polite">Ready</p>
    </header>

    <section id="consent">
      <p>When you press <strong>Start</strong>, your camera and microphone are streamed to the AI coach
        <strong>only while the session runs</strong>. Video is not stored. Press <strong>Stop</strong> any time.</p>
    </section>

    <div class="viewport">
      <video id="preview" playsinline muted autoplay aria-label="Camera preview"></video>
    </div>

    <fieldset id="mode">
      <legend>Mode</legend>
      <label><input type="radio" name="mode" value="coach" checked /> Coach (voice)</label>
      <label><input type="radio" name="mode" value="bottle" /> Watcher test: bottle</label>
      <label><input type="radio" name="mode" value="sink_start" /> Watcher: sink</label>
    </fieldset>

    <button id="toggle" type="button">Start</button>

    <section id="watch-panel" aria-label="What the watcher sees" hidden>
      <p id="watch-meta" aria-live="off">Waiting for first answer…</p>
      <ul id="watch-list"></ul>
    </section>

    <section aria-label="Conversation">
      <ol id="transcript"></ol>
    </section>

    <details>
      <summary>Debug</summary>
      <p>Frames sent: <span id="frames">0</span> · Source: <span id="source">phone camera</span></p>
    </details>
  </main>
  <script type="module" src="app.js"></script>
</body>
</html>

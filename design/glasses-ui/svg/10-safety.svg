mes chev{0%,100%{opacity:.18}45%{opacity:1}}.d1{animation-delay:.2s}.d2{animation-delay:.4s}.d3{animation-delay:.6s}.draw{stroke-dasharray:170;animation:draw 2.6s ease-out infinite}@keyframes draw{0%{stroke-dashoffset:170}35%,100%{stroke-dashoffset:0}}.pop{animation:pop 2.6s ease-out infinite}@keyframes pop{0%{transform:scale(.6);opacity:0}25%{transform:scale(1.1);opacity:1}40%,100%{transform:scale(1);opacity:1}}.breathe{animation:breathe 2.4s ease-in-out infinite}@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}.bob{animation:bob 1.8s ease-in-out infinite}@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}.heat{animation:heat 1.6s ease-out infinite}@keyframes heat{0%{transform:translateY(16px);opacity:0}40%{opacity:1}100%{transform:translateY(-22px);opacity:0}}.fly{animation:fly 2s ease-in-out infinite}@keyframes fly{0%,100%{transform:translate(0,0)}50%{transform:translate(12px,-9px)}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}.still *{animation:none!important}</style><defs><filter id="glow-safety" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="9" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><marker id="ah-cy-safety" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="3.4" markerHeight="3.4" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#00D4FF"/></marker><marker id="ah-am-safety" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="3.4" markerHeight="3.4" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#FFAA00"/></marker><marker id="ah-text-safety" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="3.4" markerHeight="3.4" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#F2F2F2"/></marker></defs><g transform="translate(300,196) scale(0.9)" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="12"><g stroke="#F2F2F2"><path d="M-50-30H50V90Q50 100 40 100H-40Q-50 
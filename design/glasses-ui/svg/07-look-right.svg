<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600" font-family="'Noto Sans', system-ui, sans-serif"><style>.fb{transform-box:fill-box;transform-origin:center}.ccw{animation:ccw 1.6s linear infinite}@keyframes ccw{to{transform:rotate(-360deg)}}.cw{animation:cw 1.6s linear infinite}@keyframes cw{to{transform:rotate(360deg)}}.pulse{animation:pulse 1.4s ease-in-out infinite}@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}.blink{animation:blink 1.2s steps(1) infinite}@keyframes blink{0%,100%{opacity:1}50%{opacity:.15}}.fall{animation:fall 1.2s ease-in infinite}@keyframes fall{0%{transform:translateY(-26px);opacity:0}20%,75%{opacity:1}100%{transform:translateY(34px);opacity:0}}.lift{animation:lift 2s ease-in-out infinite}@keyframes lift{0%,12%{transform:translateY(44px)}55%,85%{transform:translateY(0)}100%{transform:translateY(44px)}}.rise{animation:rise 2.2s cubic-bezier(.2,.8,.2,1) infinite}@keyframes rise{0%{transform:translateY(70px);opacity:0}35%,85%{transform:translateY(0);opacity:1}100%{transform:translateY(0);opacity:0}}.toL{animation:toL 2.2s cubic-bezier(.4,0,.2,1) infinite}@keyframes toL{0%,10%{transform:translateX(0)}55%,85%{transform:translateX(-84px)}100%{transform:translateX(0)}}.toR{animation:toR 2.2s cubic-bezier(.4,0,.2,1) infinite}@keyframes toR{0%,10%{transform:translateX(0)}55%,85%{transform:translateX(84px)}100%{transform:translateX(0)}}.nudgeL{animation:nudgeL 1.1s ease-in-out infinite}@keyframes nudgeL{0%,100%{transform:translateX(0)}50%{transform:translateX(-14px)}}.nudgeR{animation:nudgeR 1.1s ease-in-out infinite}@keyframes nudgeR{0%,100%{transform:translateX(0)}50%{transform:translateX(14px)}}.nudgeU{animation:nudgeU 1.1s ease-in-out infinite}@keyframes nudgeU{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}.scan{animation:scan 2.4s ease-in-out infinite}@keyframes scan{0%,100%{transform:translateY(-92px)}50%{transform:translateY(92px)}}.chev{animation:chev 1.2s ease-in-out infinite}@keyframes chev{0%,100%{opacity:.18}45%{opacity:1}}.d1{animation-delay:.2s}.d2{animation-delay:.4s}.d3{animation-delay:.6s}.draw{stroke-dasharray:170;animation:draw 2.6s ease-out infinite}@keyframes draw{0%{stroke-dashoffset:170}35%,100%{stroke-dashoffset:0}}.pop{animation:pop 2.6s ease-out infinite}@keyframes pop{0%{transform:scale(.6);opacity:0}25%{transform:scale(1.1);opacity:1}40%,100%{transform:scale(1);opacity:1}}.breathe{animation:breathe 2.4s ease-in-out infinite}@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}.bob{animation:bob 1.8s ease-in-out infinite}@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}.heat{animation:heat 1.6s ease-out infinite}@keyframes heat{0%{transform:translateY(16px);opacity:0}40%{opacity:1}100%{transform:translateY(-22px);opacity:0}}.fly{animation:fly 2s ease-in-out infinite}@keyframes fly{0%,100%{transform:translate(0,0)}50%{transform:translate(12px,-9px)}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}.still *{animation:none!important}</style><defs><filter id="glow-look-right" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="9" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><marker id="ah-cy-look-right" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="3.4" markerHeight="3.4" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#00D4FF"/></marker><marker id="ah-am-look-right" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="3.4" markerHeight="3.4" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#FFAA00"/></marker><marker id="ah-text-look-right" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="3.4" markerHeight="3.4" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#F2F2F2"/></marker></defs><g class="blink"><circle cx="281" cy="46" r="7" fill="#FF4D4D"/></g><g fill="none" stroke="#C9CDD2" stroke-width="2.6" stroke-linejoin="round"><rect x="296" y="37" width="